<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClipRazor Support</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #121212;
      --fg: #f4f4f4;
      --muted: #b8b8b8;
      --card: #1e1e1e;
      --link: #7cc7ff;
    }
    body {
      margin: 0;
      font-family: Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
    }
    p {
      line-height: 1.6;
    }
    ul {
      line-height: 1.8;
    }
    a {
      color: var(--link);
    }
    .muted {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>ClipRazor</h1>
      <p>Official support and policy pages for ClipRazor: Lossless Video Cutter.</p>
      <ul>
        <li><a href="privacy.html">Privacy Policy</a></li>
        <li><a href="support.html">Support</a></li>
        <li><a href="https://github.com/yephick/YePhIcK-leisure">Source Repository</a></li>
      </ul>
      <p class="muted">ClipRazor edits and exports video locally on your device.</p>
    </div>
  </main>
</body>
</html>
